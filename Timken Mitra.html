<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Timken Mitra</title>
    <script>
        const androidUrl = "https://play.google.com/store/apps/details?id=com.tfl.timken&hl=en_IN";
        const iosUrl = "https://apps.apple.com/us/app/timken-mitra/id6760995051";

        const ua = navigator.userAgent;

        if (/Android/i.test(ua)) {
            window.location.replace(androidUrl);
        } else if (/iPhone|iPad|iPod/i.test(ua)) {
            window.location.replace(iosUrl);
        } else {
            // Desktop or unsupported device
            window.location.replace(androidUrl);
        }
    </script>
</head>
<body>
    Redirecting to Timken Mitra...
</body>
</html>
